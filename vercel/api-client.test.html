<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>api-client.js — Test Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 20px; font-weight: 700; color: #7c3aed; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .config-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .config-box label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    .config-box input { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #e2e8f0; padding: 8px 10px; font-size: 13px; font-family: monospace; }
    .btn { background: #7c3aed; color: #fff; border: none; border-radius: 6px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 8px; margin-top: 10px; }
    .btn:hover { background: #6d28d9; }
    .btn-sm { padding: 5px 12px; font-size: 12px; background: #334155; }
    .btn-sm:hover { background: #475569; }
    .btn-run-all { background: #059669; }
    .btn-run-all:hover { background: #047857; }
    .results { margin-top: 20px; }
    .suite { background: #1e293b; border: 1px solid #334155; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .suite-header { padding: 10px 14px; font-size: 13px; font-weight: 700; background: #263349; display: flex; align-items: center; gap: 8px; }
    .suite-body { padding: 10px 14px; }
    .case { padding: 5px 0; border-bottom: 1px solid #1e293b; font-size: 12px; display: flex; align-items: flex-start; gap: 8px; }
    .case:last-child { border-bottom: none; }
    .icon-pass { color: #10b981; }
    .icon-fail { color: #ef4444; }
    .icon-skip { color: #94a3b8; }
    .icon-run  { color: #f59e0b; }
    .case-name { flex: 1; }
    .case-msg  { color: #94a3b8; font-family: monospace; font-size: 11px; }
    .summary   { font-size: 13px; padding: 10px 14px; background: #0f172a; border-top: 1px solid #334155; }
    .pass { color: #10b981; }
    .fail { color: #ef4444; }
    .skip { color: #94a3b8; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-left: 4px; }
    .badge-pass { background: #064e3b; color: #10b981; }
    .badge-fail { background: #450a0a; color: #ef4444; }
    .badge-skip { background: #1e293b; color: #64748b; }
    .final-bar  { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 18px; margin-top: 16px; font-size: 14px; font-weight: 700; display: flex; gap: 20px; }
    pre { font-family: monospace; font-size: 11px; color: #94a3b8; background: #0f172a; border-radius: 4px; padding: 8px; margin-top: 6px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
    #log-output { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 11px; color: #64748b; max-height: 200px; overflow-y: auto; margin-top: 12px; }
    .log-info  { color: #94a3b8; }
    .log-pass  { color: #10b981; }
    .log-fail  { color: #ef4444; }
    .log-warn  { color: #f59e0b; }
  </style>
</head>
<body>

<h1>🧪 api-client.js — Test Harness</h1>
<p class="subtitle">Verifikasi fetch adapter, polyfill google.script.run, dan bootstrap Vercel</p>

<div class="config-box">
  <label>GAS Web App URL (diperlukan untuk live tests)</label>
  <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec">
  <br>
  <button class="btn btn-sm" onclick="saveGasUrl()">Simpan URL</button>
  <button class="btn btn-sm" onclick="clearGasUrl()">Reset</button>
  <span id="url-status" style="font-size:12px; margin-left:12px; color:#64748b;"></span>
</div>

<button class="btn btn-run-all" onclick="runAllTests()">▶ Jalankan Semua Test</button>
<button class="btn btn-sm" onclick="runSuite('polyfill')">Polyfill</button>
<button class="btn btn-sm" onclick="runSuite('gasApi')">gasApi API</button>
<button class="btn btn-sm" onclick="runSuite('bootstrap')">Bootstrap</button>
<button class="btn btn-sm" onclick="runSuite('live')">Live (butuh URL)</button>

<div id="results" class="results"></div>
<div id="log-output"></div>

<!-- Load api-client.js -->
<script src="/api-client.js"></script>

<script>
'use strict';

// ─── Test Infrastructure ──────────────────────────────────────────────────

var _testLog = [];

function tlog(msg, type) {
  type = type || 'info';
  _testLog.push({ msg: msg, type: type });
  var el = document.getElementById('log-output');
  var div = document.createElement('div');
  div.className = 'log-' + type;
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

var SUITES = {};

function suite(name, cases) {
  SUITES[name] = cases;
}

/** Run one async test case → { ok, name, message, duration } */
async function runCase(name, fn) {
  var t0 = Date.now();
  try {
    var result = await Promise.resolve(fn());
    var ok  = result === true || (result && result.ok === true);
    var msg = (result && result.message) ? result.message : (ok ? '' : 'FAIL');
    return { ok: ok, name: name, message: msg, duration: Date.now() - t0 };
  } catch(e) {
    return { ok: false, name: name, message: 'EXCEPTION: ' + e.message, duration: Date.now() - t0 };
  }
}

async function runSuite(suiteName) {
  var cases = SUITES[suiteName];
  if (!cases) { tlog('Suite "' + suiteName + '" tidak ditemukan', 'warn'); return; }

  var results = [];
  for (var i = 0; i < cases.length; i++) {
    var c = cases[i];
    if (c === null) { results.push({ ok: null, name: '(skip)', message: '' }); continue; }
    var r = await runCase(c.name, c.fn);
    results.push(r);
    tlog((r.ok ? '✓' : '✗') + ' ' + c.name + (r.message ? ': ' + r.message : ''), r.ok ? 'pass' : 'fail');
  }

  renderSuite(suiteName, results);
  return results;
}

async function runAllTests() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('log-output').innerHTML = '';
  _testLog = [];

  var totalP = 0, totalF = 0, totalS = 0;
  for (var sname in SUITES) {
    var results = await runSuite(sname);
    results.forEach(function(r) {
      if (r.ok === null) totalS++;
      else if (r.ok)     totalP++;
      else               totalF++;
    });
  }

  var bar = document.createElement('div');
  bar.className = 'final-bar';
  bar.innerHTML = '<span class="pass">✓ ' + totalP + ' passed</span>' +
                  '<span class="fail">✗ ' + totalF + ' failed</span>' +
                  '<span class="skip">○ ' + totalS + ' skipped</span>';
  document.getElementById('results').appendChild(bar);

  tlog('=== TOTAL: ' + totalP + 'P ' + totalF + 'F ' + totalS + 'S ===', totalF > 0 ? 'fail' : 'pass');
}

function renderSuite(name, results) {
  var p = results.filter(function(r) { return r.ok === true;  }).length;
  var f = results.filter(function(r) { return r.ok === false; }).length;
  var s = results.filter(function(r) { return r.ok === null;  }).length;
  var icon = f > 0 ? '✗' : '✓';

  var html = '<div class="suite">' +
    '<div class="suite-header">' + icon + ' ' + name +
    '<span class="badge badge-pass">' + p + ' P</span>' +
    (f > 0 ? '<span class="badge badge-fail">' + f + ' F</span>' : '') +
    (s > 0 ? '<span class="badge badge-skip">' + s + ' S</span>' : '') +
    '</div><div class="suite-body">';

  results.forEach(function(r) {
    var ico = r.ok === null ? '○' : (r.ok ? '✓' : '✗');
    var cls = r.ok === null ? 'skip' : (r.ok ? 'pass' : 'fail');
    html += '<div class="case"><span class="icon-' + cls + '">' + ico + '</span>' +
            '<span class="case-name">' + r.name + '</span>' +
            (r.message ? '<span class="case-msg">' + escHtml(r.message) + '</span>' : '') +
            (r.duration ? '<span class="case-msg" style="margin-left:auto">' + r.duration + 'ms</span>' : '') +
            '</div>';
  });

  html += '</div></div>';
  document.getElementById('results').insertAdjacentHTML('beforeend', html);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function saveGasUrl() {
  var url = document.getElementById('gas-url-input').value.trim();
  if (!url) return;
  gasApi.setUrl(url);
  document.getElementById('url-status').textContent = '✓ URL tersimpan';
}

function clearGasUrl() {
  localStorage.removeItem('__gas_url__');
  document.getElementById('gas-url-input').value = '';
  document.getElementById('url-status').textContent = 'URL dihapus — reload halaman';
}

// Init URL input from localStorage
(function() {
  var stored = localStorage.getItem('__gas_url__');
  if (stored) {
    document.getElementById('gas-url-input').value = stored;
    document.getElementById('url-status').textContent = '(dari localStorage)';
  }
})();

// ─── SUITE: Polyfill ─────────────────────────────────────────────────────

suite('polyfill', [
  {
    name: 'window.google terdefinisi',
    fn: function() {
      return typeof window.google === 'object';
    }
  },
  {
    name: 'window.google.script terdefinisi',
    fn: function() {
      return typeof window.google.script === 'object';
    }
  },
  {
    name: 'google.script.run terdefinisi',
    fn: function() {
      return typeof window.google.script.run !== 'undefined';
    }
  },
  {
    name: 'google.script.run.__isPolyfill__ = true',
    fn: function() {
      if (window.google.script.run.__isPolyfill__ !== true)
        return { ok: false, message: 'bukan polyfill — mungkin running di GAS?' };
      return true;
    }
  },
  {
    name: 'google.script.run.withSuccessHandler returns runner',
    fn: function() {
      var runner = window.google.script.run.withSuccessHandler(function() {});
      return typeof runner === 'object';
    }
  },
  {
    name: 'google.script.run.withFailureHandler returns runner',
    fn: function() {
      var runner = window.google.script.run.withFailureHandler(function() {});
      return typeof runner === 'object';
    }
  },
  {
    name: 'chained .with*Handler returns runner with methods',
    fn: function() {
      var runner = window.google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(function() {});
      return typeof runner === 'object';
    }
  },
  {
    name: 'calling a function on runner does not throw',
    fn: function() {
      try {
        // GAS_URL mungkin belum diset, tapi tidak boleh throw
        window.google.script.run.withSuccessHandler(function() {})
          .withFailureHandler(function() {})
          .getScriptTimezone();
        return true;
      } catch(e) {
        return { ok: false, message: e.message };
      }
    }
  },
  {
    name: 'window.gasApi terdefinisi',
    fn: function() {
      return typeof window.gasApi === 'object';
    }
  },
  {
    name: 'gasApi.call is function',
    fn: function() {
      return typeof gasApi.call === 'function';
    }
  },
  {
    name: 'gasApi.setUrl / getUrl roundtrip',
    fn: function() {
      var old = gasApi.getUrl();
      gasApi.setUrl('https://example.com/test');
      var got = gasApi.getUrl();
      gasApi.setUrl(old || ''); // restore
      return got === 'https://example.com/test';
    }
  },
  {
    name: 'gasApi.call returns Promise',
    fn: function() {
      var p = gasApi.call('getScriptTimezone');
      return p instanceof Promise;
    }
  }
]);

// ─── SUITE: gasApi API ───────────────────────────────────────────────────

suite('gasApi', [
  {
    name: 'gasApi.call rejects when URL not set',
    fn: async function() {
      var old = gasApi.getUrl();
      gasApi.setUrl('__GAS_URL_PLACEHOLDER__');
      try {
        await gasApi.call('getScriptTimezone');
        gasApi.setUrl(old || '');
        return { ok: false, message: 'seharusnya reject' };
      } catch(e) {
        gasApi.setUrl(old || '');
        return true;
      }
    }
  },
  {
    name: 'gasApi.getConfig resolves with object (URL not set → default)',
    fn: async function() {
      var old = gasApi.getUrl();
      gasApi.setUrl('__GAS_URL_PLACEHOLDER__'); // force default path
      var cfg = await gasApi.getConfig();
      gasApi.setUrl(old || '');
      return typeof cfg === 'object';
    }
  },
  {
    name: 'gasApi.setTimeout sets timeout without throwing',
    fn: function() {
      try {
        gasApi.setTimeout(90000);
        gasApi.setTimeout(60000); // restore default
        return true;
      } catch(e) {
        return { ok: false, message: e.message };
      }
    }
  },
  {
    name: 'gasApi.getUrl returns string',
    fn: function() {
      return typeof gasApi.getUrl() === 'string';
    }
  },
  {
    name: 'google.script.run calls gasApi._post (via callback pattern)',
    fn: async function() {
      // Intercept: set URL to invalid so we get a known rejection
      var old = gasApi.getUrl();
      gasApi.setUrl('__GAS_URL_PLACEHOLDER__');
      return new Promise(function(resolve) {
        window.google.script.run
          .withSuccessHandler(function() {
            gasApi.setUrl(old || '');
            resolve(true); // bisa saja resolve dengan data
          })
          .withFailureHandler(function(err) {
            gasApi.setUrl(old || '');
            // Error karena URL tidak valid = adapter berfungsi
            resolve(true);
          })
          .getScriptTimezone();
      });
    }
  }
]);

// ─── SUITE: Bootstrap ────────────────────────────────────────────────────

suite('bootstrap', [
  {
    name: 'gasConfigLoaded event fires',
    fn: function() {
      return new Promise(function(resolve) {
        var fired = false;
        var handler = function() { fired = true; };
        document.addEventListener('gasConfigLoaded', handler);
        // Dispatch manually to simulate bootstrap
        document.dispatchEvent(new CustomEvent('gasConfigLoaded', { detail: { timezone: 'Asia/Jakarta' } }));
        document.removeEventListener('gasConfigLoaded', handler);
        resolve(fired);
      });
    }
  },
  {
    name: 'gasConfigLoaded event contains detail object',
    fn: function() {
      return new Promise(function(resolve) {
        var detail = null;
        var handler = function(ev) { detail = ev.detail; };
        document.addEventListener('gasConfigLoaded', handler);
        document.dispatchEvent(new CustomEvent('gasConfigLoaded', { detail: { app_name: 'TEST', timezone: 'WIB' } }));
        document.removeEventListener('gasConfigLoaded', handler);
        if (!detail || detail.app_name !== 'TEST') {
          resolve({ ok: false, message: 'detail tidak benar: ' + JSON.stringify(detail) });
        } else {
          resolve(true);
        }
      });
    }
  },
  {
    name: 'data-cfg="app_name" elements get filled by bootstrap',
    fn: function() {
      var el = document.createElement('h1');
      el.setAttribute('data-cfg', 'app_name');
      el.id = '__test_app_name__';
      document.body.appendChild(el);

      document.dispatchEvent(new CustomEvent('gasConfigLoaded', {
        detail: { app_name: 'SIPADU TEST', timezone: 'Asia/Jakarta' }
      }));

      // Bootstrap listener in api-client.js fills these
      // Wait one tick then check
      return new Promise(function(resolve) {
        setTimeout(function() {
          var el2 = document.getElementById('__test_app_name__');
          document.body.removeChild(el2);
          // Note: bootstrap fills data-cfg="app_name" from its own handler
          // Here we only verify the event mechanism is correct
          resolve(true);
        }, 50);
      });
    }
  },
  {
    name: 'window.APP_TIMEZONE set from gasConfigLoaded',
    fn: function() {
      return new Promise(function(resolve) {
        document.dispatchEvent(new CustomEvent('gasConfigLoaded', {
          detail: { timezone: 'Asia/Makassar', app_name: 'X' }
        }));
        // api-client.js _bootstrap sets window._appTimezone from gasConfigLoaded
        // The event was already fired on load. We verify the property exists.
        setTimeout(function() {
          resolve(typeof window._appTimezone === 'string' ||
                  typeof window.APP_TIMEZONE === 'string');
        }, 50);
      });
    }
  },
  {
    name: '__GAS_CONFIG__ div is present in DOM',
    fn: function() {
      var div = document.getElementById('__GAS_CONFIG__');
      if (!div) return { ok: false, message: 'div #__GAS_CONFIG__ tidak ada — pastikan build.js sudah dijalankan' };
      return true;
    }
  },
  {
    name: 'document title tidak mengandung template placeholder',
    fn: function() {
      var title = document.title;
      if (title.indexOf('<?=') !== -1)
        return { ok: false, message: 'Title masih mengandung GAS template: ' + title };
      return true;
    }
  },
  {
    name: 'tidak ada <?= ... ?> di body HTML',
    fn: function() {
      var bodyHtml = document.documentElement.innerHTML;
      if (bodyHtml.indexOf('<?=') !== -1)
        return { ok: false, message: 'Ada GAS template expression yang belum diganti' };
      return true;
    }
  }
]);

// ─── SUITE: Live (membutuhkan GAS URL) ───────────────────────────────────

suite('live', [
  {
    name: 'GET /exec → app config (health check)',
    fn: async function() {
      var url = gasApi.getUrl();
      if (!url || url === '__GAS_URL_PLACEHOLDER__')
        return { ok: false, message: 'Set GAS URL dulu (kolom input di atas)' };

      var cfg = await gasApi.getConfig();
      if (typeof cfg !== 'object') return { ok: false, message: 'bukan object: ' + typeof cfg };
      if (!cfg.timezone) return { ok: false, message: 'timezone hilang dari config' };
      return true;
    }
  },
  {
    name: 'POST getScriptTimezone → string',
    fn: async function() {
      var url = gasApi.getUrl();
      if (!url || url === '__GAS_URL_PLACEHOLDER__')
        return { ok: false, message: 'GAS URL belum diset' };

      var tz = await gasApi.call('getScriptTimezone');
      if (typeof tz !== 'string' || tz.length < 3)
        return { ok: false, message: 'bukan string timezone: ' + tz };
      return true;
    }
  },
  {
    name: 'POST getMasterData → { classes, subjects }',
    fn: async function() {
      var url = gasApi.getUrl();
      if (!url || url === '__GAS_URL_PLACEHOLDER__')
        return { ok: false, message: 'GAS URL belum diset' };

      var data = await gasApi.call('getMasterData');
      if (!Array.isArray(data.classes))  return { ok: false, message: 'classes bukan array' };
      if (!Array.isArray(data.subjects)) return { ok: false, message: 'subjects bukan array' };
      return true;
    }
  },
  {
    name: 'POST __FAKE_FUNCTION__ → rejected (403)',
    fn: async function() {
      var url = gasApi.getUrl();
      if (!url || url === '__GAS_URL_PLACEHOLDER__')
        return { ok: false, message: 'GAS URL belum diset' };

      try {
        await gasApi.call('__FAKE_DANGEROUS_FUNCTION__');
        return { ok: false, message: 'seharusnya reject' };
      } catch(e) {
        // Error = good (forbidden)
        return true;
      }
    }
  },
  {
    name: 'POST loginUser bad credentials → success:false (not throw)',
    fn: async function() {
      var url = gasApi.getUrl();
      if (!url || url === '__GAS_URL_PLACEHOLDER__')
        return { ok: false, message: 'GAS URL belum diset' };

      var result = await gasApi.call('loginUser', '__BAD_USER__', '__BAD_PASS__', null, false);
      if (!result || result.success !== false)
        return { ok: false, message: 'seharusnya { success: false }, dapat: ' + JSON.stringify(result) };
      return true;
    }
  },
  {
    name: 'google.script.run pattern works against live GAS',
    fn: function() {
      var url = gasApi.getUrl();
      if (!url || url === '__GAS_URL_PLACEHOLDER__')
        return { ok: false, message: 'GAS URL belum diset' };

      return new Promise(function(resolve, reject) {
        var timeout = setTimeout(function() {
          resolve({ ok: false, message: 'Timeout 15s' });
        }, 15000);

        window.google.script.run
          .withSuccessHandler(function(tz) {
            clearTimeout(timeout);
            if (typeof tz === 'string' && tz.length > 2) resolve(true);
            else resolve({ ok: false, message: 'bukan timezone: ' + tz });
          })
          .withFailureHandler(function(err) {
            clearTimeout(timeout);
            resolve({ ok: false, message: String(err && err.message || err) });
          })
          .getScriptTimezone();
      });
    }
  }
]);
</script>

</body>
</html>
